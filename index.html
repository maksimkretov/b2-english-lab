 conditional:'Conditionals',mixed:'Mixed conditionals',inversion:'Inversion',causative:'Have / get something done',passive:'Passive voice',cleft:'Cleft sentences',indirect:'Indirect questions',usedto:'Used to / get used to',modal:'Modal perfect',complex:'Complex object',contrast:'Despite / whereas / lest',past:'Narrative tenses',reported:'Reported speech',purpose:'Purpose / result',advanced:'Другие конструкции B2'

[1,'usedto','Я привык работать под давлением, но ещё не привык выступать перед большой аудиторией.',"I'm used to working under pressure, but I still haven't got used to speaking in front of a large audience.",'I am used to working under pressure, but I am still not used to speaking in public.','После be/get used to ставится существительное или форма -ing.','Be used to означает «быть привычным», get used to — «привыкать». Оба требуют -ing после to.',[['under pressure','под давлением'],['get used to','привыкнуть к']],['used to working','used to speaking']],
[2,'past','К тому моменту, как мы добрались до станции, поезд уже ушёл.','By the time we got to the station, the train had already left.','When we arrived at the station, the train had already departed.','Прошедшее действие, которое произошло раньше другого: Past Perfect.','Сначала поезд ушёл (had left), затем мы прибыли (got / arrived).', [['by the time','к тому моменту как'],['depart','отправляться']],['had already left']],
[3,'purpose','Повар посоветовал мне добавлять лимонный сок понемногу, чтобы соус не получился слишком кислым.',"The chef advised me to add lemon juice a little at a time so that the sauce wouldn't be too sour.","The chef recommended adding lemon juice gradually to prevent the sauce from becoming too sour.",'Advise someone to do something; so that + could/would.','Advise me to add, не advise to me add. A little at a time — «понемногу».',[['a little at a time','понемногу'],['sour','кислый']],['advised me to','so that']],
[4,'passive','Старый театр собирались снести, но местные жители убедили власти сохранить его.','The old theatre was about to be demolished, but local residents persuaded the authorities to save it.','The old theater was going to be demolished, but locals convinced the authorities to preserve it.','Be about to + be + V3, когда действие происходит над объектом.','Театр не «сносил», его собирались снести. Нужна пассивная форма be demolished.',[['be about to','вот-вот / собираться'],['demolish','сносить']],['be demolished']],

[6,'past','Фильм оказался настолько захватывающим, что я не заметил, как пролетели два часа.',"The film turned out to be so gripping that I didn't notice that two hours had passed.",'The film was so captivating that I lost track of time and two hours flew by.','So + adjective + that; следите за согласованием прошедших времён.','Had passed подчёркивает, что два часа уже истекли к моменту, когда я это заметил.',[['gripping','захватывающий'],['lose track of time','потерять счёт времени']],['so gripping','had passed']],

function selectItems(mode,topic){
 const pool=BANK.filter(q=>!topic||q.topic===topic);let ids=[];
 if(mode==='review'){
  const m=Object.entries(db.mistakes).filter(([id,m])=>BY_ID.has(+id)&&(!ui.reviewOnlyDue||due(m)))
   .sort((a,b)=>Number(due(b[1]))-Number(due(a[1]))||b[1].wrongCount-a[1].wrongCount||new Date(a[1].lastWrong)-new Date(b[1].lastWrong));
  ids=m.map(([id])=>+id).slice(0,5);
  for(const id of shuffle(SEEDED)){if(ids.length>=5)break;if(!ids.includes(id))ids.push(id)}
 }else{
  const recent=new Set(db.sessions.slice(-4).flatMap(s=>s.items||[]));
  const counts={};for(const s of db.sessions)for(const id of s.items||[])counts[id]=(counts[id]||0)+1;
  const glossary=new Set(db.vocabulary.map(w=>wordKey(w.en)));
  const enriched=pool.filter(q=>q.vocab.some(v=>glossary.has(wordKey(v[0]))));
  const plain=pool.filter(q=>!enriched.includes(q));
  const rank=a=>shuffle(a).sort((x,y)=>{
   const score=q=> (recent.has(q.id)?12:0)+(counts[q.id]||0)*2-(q.vocab.filter(w=>glossary.has(wordKey(w[0]))).length*1.5);
   return score(x)-score(y)
  });
  const preferred=rank(enriched),other=rank(plain);const usedTopics=new Set();
  // 4 из 5 предложений — по возможности с лексикой из личного словаря.
  for(const q of preferred){if(ids.length>=4)break;if(!usedTopics.has(q.topic)){ids.push(q.id);usedTopics.add(q.topic)}}
  for(const q of preferred){if(ids.length>=4)break;if(!ids.includes(q.id))ids.push(q.id)}
  for(const q of other){if(ids.length>=5)break;if(!ids.includes(q.id)){ids.push(q.id);usedTopics.add(q.topic)}}
  for(const q of preferred){if(ids.length>=5)break;if(!ids.includes(q.id))ids.push(q.id)}
 }
 if(ids.length<5){for(const q of shuffle(pool)){if(ids.length>=5)break;if(!ids.includes(q.id))ids.push(q.id)}}
 if(ids.length<5){for(const q of shuffle(BANK)){if(ids.length>=5)break;if(!ids.includes(q.id))ids.push(q.id)}}

function textNorm(x){return String(x||'').toLowerCase().normalize('NFKD').replace(/[’‘]/g,"'").replace(/\b(i'm)\b/g,'i am').replace(/\b(i've)\b/g,'i have').replace(/\b(i'd)\b/g,'i would').replace(/\b(we're|they're|you're)\b/g,m=>m.replace("'re",' are')).replace(/\b(won't)\b/g,'will not').replace(/\b(can't)\b/g,'cannot').replace(/\b(doesn't|don't|didn't|wasn't|weren't|isn't|aren't|haven't|hasn't|hadn't|wouldn't|shouldn't|couldn't)\b/g,m=>m.split("n't")[0]+ ' not').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function tokens(s){const stop=new Set(['i','a','an','the','of','to','in','on','at','for','from','and','but','it','that','was','is','are','had','have','be','been','we','you','he','she','they','my','our','their','his','her','as','so','do','did','would','will','could','should','not','by','with','me','him','them','us','this','were']);return new Set(textNorm(s).split(' ').filter(x=>x.length>2&&!stop.has(x)))}
function overlap(a,b){const aa=tokens(a),bb=tokens(b);if(!aa.size||!bb.size)return 0;let hit=0;for(let x of aa)if(bb.has(x))hit++;return hit/Math.max(1,Math.min(aa.size,bb.size))}
function editSimilarity(a,b){const x=textNorm(a),y=textNorm(b);if(x===y)return 1;const arrA=x.split(' '),arrB=y.split(' ');let hit=0;for(const w of arrA)if(arrB.includes(w))hit++;return 2*hit/Math.max(1,arrA.length+arrB.length)}
function markerScore(q,s){if(!q.markers.length)return 0;const cleaned=textNorm(s);return q.markers.filter(m=>cleaned.includes(textNorm(m))).length/q.markers.length}
function checkAnswer(q,s){const user=s.trim();if(!user)return null;
 const issues=GLOBAL_ISSUES.filter(z=>(!z.onlyTopic||z.onlyTopic===q.topic)&&z.re.test(user)).map(z=>z.t);
 const similarity=Math.max(editSimilarity(user,q.answer),editSimilarity(user,q.alt));
 const coverage=Math.max(overlap(user,q.answer),overlap(user,q.alt));
 const markers=markerScore(q,user);
 const exact=textNorm(user)===textNorm(q.answer)||textNorm(user)===textNorm(q.alt);
 let result=exact?2:(issues.length?0:(similarity>.79&&coverage>.62?2:(similarity>.52||coverage>.66||markers>=.6?1:0)));

function settingsPage(){return pageHeader('ДАННЫЕ И НАСТРОЙКИ','Ваш прогресс под вашим контролем','Создавайте резервные копии и переносите историю вместе со словарём на другой компьютер.')+
 `<div class="panel"><h3 style="margin-top:0">Резервное копирование</h3><p class="muted" style="font-size:13px">Скачать JSON-файл со всеми занятиями, текущими сессиями, ошибками, словарём и историей повторений слов. Для переноса на другое устройство откройте там сайт и импортируйте файл.</p><div class="settings-actions"><button class="btn btn-primary" data-action="export">↓ Скачать резервную копию JSON</button><button class="btn btn-outline" data-action="import">↑ Импортировать JSON</button></div><p class="fineprint">Импорт заменит локальную историю и словарь данными из выбранного файла, после подтверждения.</p></div>`+
 `<div class="panel"><h3 style="margin-top:0">Хранение данных</h3><p class="muted" style="font-size:13px">Автосохранение: <b>${storageOK?'включено':'недоступно в этом браузере'}</b>. Данные лежат в хранилище браузера этого устройства. Сайт работает без интернета и не отправляет ваши тексты на сервер.</p><div class="settings-actions"><button class="btn btn-red" data-action="reset">Очистить локальный прогресс</button></div></div>`+
 `<div class="panel"><h3 style="margin-top:0">О проверке переводов</h3><p class="muted" style="font-size:13px">Встроенная проверка — локальная: сравнение с двумя образцами, грамматическими маркерами и частыми ошибками. Она умеет подсказывать по конструкциям, но не может надёжно оценить все грамматически правильные варианты. Вы сами решаете, засчитать ли ответ. Для глубокой проверки свободного перевода можно скопировать готовый запрос и отправить его в ChatGPT.</p><button class="btn btn-ghost btn-small" data-action="copy-prompt">Скопировать запрос для проверки в ChatGPT</button></div>`}
function render(){const root=document.getElementById('main');root.innerHTML=({home:homePage,practice:practicePage,review:reviewPage,wordtrain:wordPage,vocab:vocabPage,history:historyPage,settings:settingsPage}[ui.page]||homePage)()+`<div class="footer">B2 ENGLISH LAB · Персональная тренировка · Автономный сайт · ${BANK.length} авторских заданий</div>`;
 document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===ui.page));
 const s=document.getElementById('vocabSearch');if(s){s.addEventListener('input',e=>{ui.vocabSearch=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('vocabSearch');el?.focus();try{el?.setSelectionRange(pos,pos)}catch(_){}})}
 const form=document.getElementById('wordForm');if(form){form.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(form);const ok=addWord(d.get('en'),d.get('ru'),'Вручную');if(ok){render();flash(ui.notice)}else flash(ui.notice||'Проверьте заполнение полей')})}
 const wa=document.getElementById('wordAnswer');if(wa){wa.addEventListener('input',e=>{if(db.currentWord){db.currentWord.draft=e.target.value;ui.wordDraft=e.target.value;save()}})}
 const a=document.getElementById('answer');if(a){a.addEventListener('input',e=>{ui.answer=e.target.value;if(db.current){db.current.draft=ui.answer;save()}})}
}
function flash(s){let n=document.createElement('div');n.textContent=s;Object.assign(n.style,{position:'fixed',bottom:'22px',right:'20px',zIndex:'1000',background:'#20304a',color:'white',padding:'12px 17px',borderRadius:'11px',maxWidth:'min(350px,90vw)',boxShadow:'0 9px 30px #17264233',fontSize:'13px'});document.body.appendChild(n);setTimeout(()=>n.remove(),2900)}
function download(filename,content,mime='application/json;charset=utf-8'){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportData(){download('B2_English_Lab_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({exportedAt:nowISO(),app:'B2-English-Lab',data:db},null,2))}
function exportVocab(){const lines=[['English','Русский','Выучено'],...db.vocabulary.map(v=>[v.en,v.ru,v.learned?'да':'нет'])];const csv='\uFEFF'+lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');download('B2_English_Lab_vocabulary.csv',csv,'text/csv;charset=utf-8')}
function copyPrompt(){const q=currentQ();let prompt=q?`Проверь мой перевод с русского на английский на уровне B2.\nОригинал: ${q.ru}\nМой ответ: ${ui.answer||db.current?.draft||'(не указан)'}\nОбразец: ${q.answer}\nПокажи исправленный вариант и объясни каждую существенную ошибку по-русски.`:'Проверь мои переводы с русского на английский на уровне B2. Исправь грамматические и лексические ошибки и объясни их по-русски.';const done=()=>flash('Запрос скопирован. Вставьте его в ChatGPT.');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(prompt).then(done).catch(()=>fallbackCopy(prompt))}else fallbackCopy(prompt)}
function fallbackCopy(text){const el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();try{document.execCommand('copy');flash('Запрос скопирован. Вставьте в ChatGPT.')}catch(e){flash('Скопировать не удалось — проверьте разрешения браузера.')}el.remove()}
function nav(p){ui.page=p;ui.notice='';if(p==='practice'&&db.current){ui.answer=db.current.draft||'';ui.feedback=null;ui.hint=!!db.current.hintSeen}if(p!=='practice')ui.summary=null;if(p==='wordtrain')ui.wordSummary=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function handleAction(action){switch(action){case 'new-mixed':startSession('mixed');break;case 'new-review':startSession('review');break;case 'resume':continueCurrent();break;case 'hint':ui.hint=!ui.hint;if(db.current){db.current.hintSeen=ui.hint;save()}render();break;
 case 'check':{const q=currentQ();if(!q)return;const text=document.getElementById('answer')?.value||ui.answer;if(!text.trim()){flash('Сначала напишите перевод.');focusAnswer();return}ui.answer=text;ui.feedback=checkAnswer(q,text);render();document.querySelector('.feedback')?.scrollIntoView({behavior:'smooth',block:'nearest'});break}
 case 'retry':ui.feedback=null;render();focusAnswer();break;
 case 'mark-right':finalizeAnswer(true);break;case 'mark-wrong':finalizeAnswer(false);break;
 case 'finish-early':if(!db.current)return;if(!db.current.answers.length){if(!confirm('Завершить сессию без ответов? Она не попадёт в историю.'))return;db.current=null;save();nav('home');return}if(confirm('Завершить сессию сейчас? Уже проверенные ответы сохранятся в истории.'))endSession();break;
 case 'word-new':startWordSession('new');break;case 'word-review':startWordSession('review');break;case 'word-quiz':startWordSession('quiz');break;
 case 'word-reveal':if(db.currentWord){db.currentWord.revealed=true;save();render()}break;
 case 'word-check':wordCheck();break;case 'word-right':markWord(true);break;case 'word-wrong':markWord(false);break;
 case 'word-stop':if(db.currentWord){if(!db.currentWord.answers.length){db.currentWord=null;save();render()}else if(confirm('Закончить и сохранить текущие результаты?'))finishWordSession('interrupted')}break;
 case 'word-speak':{const w=currentWord();if(w&&'speechSynthesis' in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.en);u.lang='en-GB';u.rate=.85;window.speechSynthesis.speak(u)}else flash('Произношение недоступно в этом браузере')}break;
 case 'word-resume':ui.wordSummary=null;ui.page='wordtrain';render();break;
 case 'vocab-export':exportVocab();break;case 'export':exportData();break;case 'import':document.getElementById('importFile').click();break;case 'copy-prompt':copyPrompt();break;
 case 'reset':if(confirm('Удалить ВСЮ локальную историю, словарь и ошибки? Это действие необратимо без резервной копии.')){if(confirm('Последнее подтверждение: удалить локальный прогресс?')){db=freshDB();db.settings.skillboxSeeded=true;ui.wordSummary=null;ui.summary=null;ui.feedback=null;ui.answer='';save();nav('home');flash('Локальный прогресс очищен.')}}break;
}}
document.addEventListener('click',e=>{
 const navB=e.target.closest('[data-nav]');if(navB){nav(navB.dataset.nav);return}
 const a=e.target.closest('[data-action]');if(a){handleAction(a.dataset.action);return}
 const topic=e.target.closest('[data-topic]');if(topic){startSession('focus',topic.dataset.topic);return}
 const word=e.target.closest('[data-addword]');if(word){const [id,k]=word.dataset.addword.split(':').map(Number),q=BY_ID.get(id),v=q?.vocab[k];if(v){const ok=addWord(v[0],v[1],TOPICS[q.topic]);flash(ui.notice);if(ok)render()}return}
 const learn=e.target.closest('[data-learn]');if(learn){const v=db.vocabulary.find(x=>x.id===learn.dataset.learn);if(v){v.learned=!v.learned;if(v.learned){db.wordProgress[v.id]={...wordRecord(v.id),attempts:Math.max(1,wordRecord(v.id).attempts),streak:3,nextDue:new Date(Date.now()+30*86400000).toISOString()}}else{db.wordProgress[v.id]={...wordRecord(v.id),streak:0,nextDue:nowISO()}}save();render()}return}
 const del=e.target.closest('[data-delword]');if(del){if(confirm('Удалить это слово из словаря?')){db.vocabulary=db.vocabulary.filter(w=>w.id!==del.dataset.delword);delete db.wordProgress[del.dataset.delword];save();render()}return}
 const h=e.target.closest('[data-togglehistory]');if(h){const id=h.dataset.togglehistory;ui.historyOpen[id]=!ui.historyOpen[id];render();return}
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){if(ui.page==='practice'&&db.current&&!ui.feedback){e.preventDefault();handleAction('check')}else if(ui.page==='wordtrain'&&db.currentWord?.mode==='quiz'&&!db.currentWord.revealed){e.preventDefault();handleAction('word-check')}}});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>5000000)throw Error('Слишком большой файл (максимум 5 МБ)');const json=JSON.parse(await file.text());const d=json?.data||json;if(d.version!==1||!Array.isArray(d.sessions)||!Array.isArray(d.vocabulary)||!d.mistakes||typeof d.mistakes!=='object'||!d.sessions.every(s=>Array.isArray(s.answers)&&Array.isArray(s.items)))throw Error('Не распознана резервная копия B2 English Lab');if(!confirm('Заменить локальный прогресс, словарь и историю данными из этого файла?'))return;db={...freshDB(),...d};seedVocabulary();if(db.current&&(!Array.isArray(db.current.items)||!Array.isArray(db.current.answers)))db.current=null;save();ui.summary=null;ui.feedback=null;ui.answer='';nav('home');flash('Резервная копия импортирована')}catch(err){flash('Ошибка импорта: '+String(err.message||err))}});
setInterval(()=>{const el=document.getElementById('clock');if(el&&db.current){const elapsed=Date.now()-new Date(db.current.startedAt).getTime();el.textContent=timeFmt(elapsed);if(elapsed>=900000)el.style.color='#b36b15'}},1000);
render();
</script>
</body>
</html>
